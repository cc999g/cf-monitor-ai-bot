# ============================================================
# CF Monitor AI Bot - Wrangler 配置
# 部署前请把下面的 <占位符> 替换为你自己的值
# ============================================================
name = "cf-monitor-ai-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ACCESS"
# 在 Cloudflare Dashboard → Workers & Pages → KV 里创建命名空间后填入 ID
id = "<你的KV命名空间ID>"

[triggers]
crons = []

[vars]
# Cloudflare 账户 ID（Dashboard 首页右侧可查）
CF_ACCOUNT_ID = "<你的Cloudflare账户ID>"
# 超级管理员 Telegram Chat ID（永远是管理员，免邀请码）
TG_CHAT_ID = "<你的Telegram Chat ID>"
